spring:
  application:
    name: bank-server
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
  kafka:
    admin:
      auto-create: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

logging:
  level:
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
    org.hibernate.orm.jdbc.error: "OFF"
    org.hibernate.orm.jdbc.warn: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
